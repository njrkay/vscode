# Temporary workflow on a test branch of a fork: builds VS Code and runs the git
# extension's integration tests (including the new deleted-file smoke test) for
# fix/scm-deleted-file-decoration. Not part of the pull request.
name: Test deleted-file fix (git extension)

on:
  push:
    branches:
      - test/scm-deleted-file-decoration
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_ARCH: x64
  VSCODE_ARCH: x64
  VSCODE_SKIP_PRELAUNCH: '1'

jobs:
  git-extension-tests:
    name: Git extension tests and screenshots (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [after, before]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install system packages
        uses: ./.github/actions/install-linux-packages

      - name: Setup system services
        run: |
          set -e
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
          sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults
          sudo service xvfb start

      - name: Install build dependencies
        working-directory: build
        run: |
          set -e
          for i in {1..5}; do
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then echo "pnpm install failed too many times" >&2; exit 1; fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          set -e
          source ./build/azure-pipelines/linux/setup-env.sh
          for i in {1..5}; do
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then echo "pnpm install failed too many times" >&2; exit 1; fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          npm_config_arch: ${{ env.NPM_ARCH }}
          VSCODE_ARCH: ${{ env.VSCODE_ARCH }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download built-in extensions
        run: |
          set -e
          mkdir -p .build
          node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 'before' puts back main's version of the two changed files, to show the tab without the fix
      - name: Use the code before the fix
        if: matrix.variant == 'before'
        run: |
          set -e
          git fetch --depth=1 origin e8b6d8b546735371b1d04237b0a7c40558ad82a6
          git checkout e8b6d8b546735371b1d04237b0a7c40558ad82a6 -- extensions/git/src/repository.ts extensions/git/src/decorationProvider.ts src/vs/workbench/browser/parts/editor/multiEditorTabsControl.ts src/vs/workbench/test/browser/parts/editor/multiEditorTabsControl.test.ts
          git status --short

      - name: Transpile client and extensions
        run: pnpm run gulp transpile-client-esbuild transpile-extensions

      - name: Setup Electron
        uses: ./.github/actions/setup-electron
        with:
          arch: ${{ env.VSCODE_ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile the git extensions
        run: pnpm run gulp compile-extension:git compile-extension:git-base

      - name: Run the git extension tests (Electron)
        if: matrix.variant == 'after'
        timeout-minutes: 20
        run: ./scripts/test-integration.sh --suite git
        env:
          DISPLAY: ":10"
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: Run the new deleted-file smoke test on its own
        if: matrix.variant == 'after'
        timeout-minutes: 10
        run: ./scripts/test-integration.sh --suite git --grep 'opens deleted files with their name as the editor title'
        env:
          DISPLAY: ":10"
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: Run the editor tabs unit tests (Electron)
        if: matrix.variant == 'after'
        timeout-minutes: 20
        run: ./scripts/test.sh --run src/vs/workbench/test/browser/parts/editor/multiEditorTabsControl.test.ts --run src/vs/workbench/test/browser/labels.test.ts
        env:
          DISPLAY: ":10"
          VSCODE_SKIP_PRELAUNCH: '1'

      - name: Install the screenshot tool
        run: command -v import || sudo apt-get install -y --no-install-recommends imagemagick

      - name: Prepare a repository with a deleted and a staged-deleted file
        run: |
          set -e
          repo="$RUNNER_TEMP/demo"
          mkdir -p "$repo"
          cd "$repo"
          git init -q -b main
          git config user.name demo
          git config user.email demo@example.com
          printf 'export const answer = 42;\n' > app.ts
          printf '# Notes\n' > notes.md
          printf 'body { color: red; }\n' > styles.css
          git add .
          git commit -q -m init
          rm notes.md
          git rm -q app.ts
          git status --short
          echo "DEMO_REPO=$repo" >> "$GITHUB_ENV"

      - name: Take the screenshots
        timeout-minutes: 10
        run: |
          set -e
          mkdir -p "$SCREENSHOT_DIR"
          ./scripts/code.sh "$DEMO_REPO" --extensionDevelopmentPath="$PWD/extensions/git" --extensionTestsPath="$PWD/extensions/git/out/test-screenshot" --disable-telemetry --disable-experiments --skip-welcome --skip-release-notes --no-cached-data --disable-updates --use-inmemory-secretstorage --disable-workspace-trust --disable-extensions --user-data-dir="$RUNNER_TEMP/user-data" 2>&1 | grep -E 'TAB:|SCREENSHOT:|DIAG|Error' || true
          ls -la "$SCREENSHOT_DIR"
        env:
          DISPLAY: ":10"
          VSCODE_SKIP_PRELAUNCH: '1'
          SCREENSHOT_DIR: ${{ runner.temp }}/shots
          SCREENSHOT_VARIANT: ${{ matrix.variant }}

      - name: Upload the screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.variant }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: error

  # Also puts the screenshots on a branch of the fork, so they can be fetched with git
  publish-screenshots:
    name: Publish the screenshots to a branch
    needs: git-extension-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: shots

      - name: Commit them to screenshots/deleted-file-decoration
        run: |
          set -e
          cd shots
          ls -la
          git init -q -b screenshots
          git add .
          git -c user.name=njrkay -c user.email=70739525+njrkay@users.noreply.github.com commit -q -m "Screenshots of the deleted-file editor tab, before and after the fix"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/screenshots/deleted-file-decoration
        env:
          GH_TOKEN: ${{ github.token }}
